name: Deploy to Cloud Run

# Build -> push to Artifact Registry -> run migrations -> deploy a revision with
# no traffic -> smoke test -> shift 100% of traffic. A failed smoke test leaves
# the previous revision serving.
#
# Required repository *variables* (Settings -> Secrets and variables -> Actions -> Variables):
#   GCP_PROJECT_ID           e.g. contrarian-prod
#   GCP_REGION               e.g. us-central1
#   GCP_ARTIFACT_REPOSITORY  e.g. apps
#   GCP_SERVICE_ACCOUNT      deployer SA email, e.g. gh-deployer@<project>.iam.gserviceaccount.com
#   GCP_WORKLOAD_IDP         projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   CLOUD_RUN_SERVICE        e.g. contrarian-product-rules
#   CLOUD_RUN_RUNTIME_SA     runtime SA email the service runs as
#
# Required repository *secret*:
#   PRISMA_DIRECT_URL        Neon direct (non-pooled) connection string, used only for migrations
#
# Runtime configuration lives in Secret Manager, not here. See docs/DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDP }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            --tag "$IMAGE:${{ github.sha }}" \
            --tag "$IMAGE:latest" \
            .

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # Migrations run exactly once per release, from here rather than from the
      # container start command, so concurrent Cloud Run instances cannot race.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install migration tooling
        run: npm ci

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.PRISMA_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.PRISMA_DIRECT_URL }}
        run: npx prisma migrate deploy

      # A brand-new service cannot be created with --no-traffic: Cloud Run
      # rejects it, because there is no existing revision for traffic to stay
      # on. So the first deploy is a plain create, and every deploy after it
      # uses the candidate-then-promote flow.
      - name: Deploy new revision
        id: revision
        run: |
          set -euo pipefail
          SVC="${{ vars.CLOUD_RUN_SERVICE }}"
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          REGION="${{ vars.GCP_REGION }}"

          COMMON=(
            --project "$PROJECT"
            --region "$REGION"
            --image "$IMAGE:${{ github.sha }}"
            --service-account "${{ vars.CLOUD_RUN_RUNTIME_SA }}"
            --revision-suffix "sha-$(echo '${{ github.sha }}' | cut -c1-8)"
            --platform managed
            --allow-unauthenticated
            --port 8080
            --cpu 1
            --memory 512Mi
            --min-instances 1
            --max-instances 10
            --timeout 300
            --set-env-vars "NODE_ENV=production"
            --set-secrets "DATABASE_URL=cpr-database-url:latest,DIRECT_URL=cpr-direct-url:latest,SHOPIFY_API_KEY=cpr-shopify-api-key:latest,SHOPIFY_API_SECRET=cpr-shopify-api-secret:latest,SHOPIFY_APP_URL=cpr-shopify-app-url:latest,SCOPES=cpr-scopes:latest"
            --quiet
          )

          if gcloud run services describe "$SVC" --project "$PROJECT" --region "$REGION" >/dev/null 2>&1; then
            echo "Service exists - deploying a candidate revision that takes no traffic."
            gcloud run deploy "$SVC" "${COMMON[@]}" --no-traffic --tag candidate
            TARGET_URL=$(gcloud run services describe "$SVC"               --project "$PROJECT" --region "$REGION"               --format 'value(status.traffic.filter("tag:candidate").extract("url"))' | tr -d '[]')
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "Service does not exist yet - creating it. Nothing is serving it, so this first revision takes traffic immediately."
            gcloud run deploy "$SVC" "${COMMON[@]}"
            TARGET_URL=$(gcloud run services describe "$SVC"               --project "$PROJECT" --region "$REGION" --format 'value(status.url)')
            echo "promote=false" >> "$GITHUB_OUTPUT"
          fi

          echo "target_url=$TARGET_URL" >> "$GITHUB_OUTPUT"
          echo "Smoke testing: $TARGET_URL"

      # gcloud downgrades a failed --allow-unauthenticated to a warning and
      # still exits 0. That once produced a "successful" deploy of a service
      # nothing could reach, so the binding is applied explicitly here and the
      # job fails if it does not stick.
      - name: Ensure the service is publicly invokable
        run: |
          set -euo pipefail
          gcloud run services add-iam-policy-binding "${{ vars.CLOUD_RUN_SERVICE }}"             --project "${{ vars.GCP_PROJECT_ID }}"             --region "${{ vars.GCP_REGION }}"             --member=allUsers             --role=roles/run.invoker             --quiet

          POLICY=$(gcloud run services get-iam-policy "${{ vars.CLOUD_RUN_SERVICE }}"             --project "${{ vars.GCP_PROJECT_ID }}"             --region "${{ vars.GCP_REGION }}" --format=json)
          if ! echo "$POLICY" | grep -q '"allUsers"'; then
            echo "allUsers is not bound to roles/run.invoker."
            echo "Shopify calls this app anonymously, so it would receive 404s."
            exit 1
          fi

      - name: Smoke test the new revision
        run: |
          URL="${{ steps.revision.outputs.target_url }}/health"
          for attempt in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${CODE:-no response}; retrying in 6s"
            sleep 6
          done
          echo "Revision never became healthy. Traffic was not shifted."
          exit 1

      # Skipped on the very first deploy, where the new revision already holds
      # all traffic because it is the only one.
      - name: Shift all traffic to the new revision
        if: steps.revision.outputs.promote == 'true'
        run: |
          gcloud run services update-traffic "${{ vars.CLOUD_RUN_SERVICE }}"             --project "${{ vars.GCP_PROJECT_ID }}"             --region "${{ vars.GCP_REGION }}"             --to-latest             --quiet
